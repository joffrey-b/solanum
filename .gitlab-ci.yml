# GitLab CI for Solanum: tests on Linux and Windows, then installers.
#
# Runners this file expects (their tags are set in the two `.…-runner` templates below):
#
#   linux-mint  (a Linux Mint 22 machine). If it uses the Docker executor: the `image:` lines are used as written and scripts/ci-linux-deps.sh installs
#            the rest as root, except Node for build-linux: the Rust image has none, and the job then says so.
#            If it uses the shell executor: the `image:` lines are ignored, so the machine
#            itself needs Node.js 22.12+, Rust (stable, installed for the gitlab-runner user) and these packages:
#              build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
#              librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev
#            and, for the installers: patchelf file rpm xdg-utils
#
#   windows  Shell executor running PowerShell. Needs Node.js 22.12+, Rust stable with the MSVC toolchain
#            (Visual Studio Build Tools, "Desktop development with C++") and the WebView2 runtime.
#
# Android (build-android, on linux-mint): the machine also needs, for the gitlab-runner user, the Android SDK in
# ~/Android/Sdk (platform 36, build-tools 36.0.0, NDK 27.1.12297006) and the Rust targets aarch64-linux-android and
# armv7-linux-androideabi, and a JDK in /usr/lib/jvm/java-21-openjdk-amd64. Nothing here signs the APK: every job on
# this runner runs dependencies' build code, which could reach a key handed to any job beside it. Signed APKs come
# from release.yml (GitHub Actions), whose android-sign job runs alone on a fresh machine.
#
# Clippy's component is added by its jobs, in the runner user's own toolchain. Nothing here needs root.

stages:
  - test
  - build

# One pipeline per push, and merge-request pipelines instead of duplicate branch pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true
  retry:
    max: 1
    when: runner_system_failure

variables:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# ---------------------------------------------------------------------------------------------------
# Templates
# ---------------------------------------------------------------------------------------------------

.linux-runner:
  tags: [linux-mint]

.windows-runner:
  tags: [windows]

# The weekly schedule (CI/CD > Schedules, on main) runs only the two audits below.
.not-on-schedule:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# Rust on Linux: keep cargo's downloads and the build directory between pipelines.
.rust-linux:
  extends: .linux-runner
  image: rust:1-bookworm
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key:
      files: [src-tauri/Cargo.lock]
      prefix: "$CI_JOB_NAME"
    paths:
      - .cargo/registry
      - .cargo/git
      - src-tauri/target

# Only build installers for the default branch and for tags; on merge requests they can be started by hand.
# On a branch, put [build-installers] in the commit message to try them before merging.
.installer-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_MESSAGE =~ /\[build-installers\]/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

# ---------------------------------------------------------------------------------------------------
# test
# ---------------------------------------------------------------------------------------------------

frontend:
  stage: test
  extends: [.linux-runner, .not-on-schedule]
  image: node:26-bookworm
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm]
  script:
    - node --version
    - npm ci
    - npm run typecheck
    - npm run check:ipc
    - npm run check:versions
    - npm run test:util
    - npm run build

# THIRD-PARTY-LICENSES.txt ships with every build, and has to match the lockfiles. It reads the crates of every
# target that ships, so this job downloads some the others never do.
licenses:
  stage: test
  extends: [.rust-linux, .not-on-schedule]
  script:
    - npm ci
    - npm run check:licenses

# tauri::generate_context! embeds the frontend bundle at compile time and refuses to build if the folder
# is missing. The tests never look inside it, so a stub is enough.
test-rust-linux:
  stage: test
  extends: [.rust-linux, .not-on-schedule]
  before_script:
    - bash scripts/ci-linux-deps.sh
  script:
    - mkdir -p dist
    - echo '<!doctype html><title>ci</title>' > dist/index.html
    - cd src-tauri
    - cargo test --locked --lib
    # Starts a child process, which would disturb the profile-lock tests beside it: run alone.
    - cargo test --locked --lib -- --ignored --exact vault_format_tests::argon2_memory_the_process_cannot_get_is_refused_not_an_abort

test-rust-windows:
  stage: test
  extends: [.windows-runner, .not-on-schedule]
  script:
    - New-Item -ItemType Directory -Force -Path dist | Out-Null
    - Set-Content -Path dist/index.html -Value '<!doctype html><title>ci</title>'
    - cd src-tauri
    - cargo test --locked --lib

# Lints that point at bugs stop the pipeline. Style stays a warning for now, and rustfmt is not checked
# (the tree is not formatted). Both operating systems: a good part of the code is behind cfg(windows).
clippy-linux:
  stage: test
  extends: [.rust-linux, .not-on-schedule]
  before_script:
    - bash scripts/ci-linux-deps.sh
    - rustup component add clippy
  script:
    - mkdir -p dist
    - echo '<!doctype html><title>ci</title>' > dist/index.html
    - cd src-tauri
    - cargo clippy --locked --all-targets -- -D clippy::correctness -D clippy::suspicious -D clippy::perf

clippy-windows:
  stage: test
  extends: [.windows-runner, .not-on-schedule]
  before_script:
    - rustup component add clippy
  script:
    - New-Item -ItemType Directory -Force -Path dist | Out-Null
    - Set-Content -Path dist/index.html -Value '<!doctype html><title>ci</title>'
    - cd src-tauri
    - cargo clippy --locked --all-targets -- -D clippy::correctness -D clippy::suspicious -D clippy::perf

# Dependency advisories, weekly from the schedule (and by hand, where a failure only informs). A scheduled run fails on
# a new vulnerability, or a crate newly found unsound or yanked (unmaintained ones are listed only), so it turns the
# pipeline red. Named here, each with its reason in SECURITY.md: RUSTSEC-2023-0071, the `rsa` timing side channel (no
# fixed release); RUSTSEC-2024-0429, glib 0.18's iterator (fixed only in releases the GTK 3 stack does not use).
audit-cargo:
  stage: test
  extends: .rust-linux
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
      allow_failure: true
  script:
    - cargo install cargo-audit --locked
    - cargo audit --file src-tauri/Cargo.lock --deny unsound --deny yanked --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0429

audit-npm:
  stage: test
  extends: .linux-runner
  image: node:26-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
      allow_failure: true
  # The whole tree, dev tools too: they run on the machine that builds the release.
  script:
    - npm audit

# ---------------------------------------------------------------------------------------------------
# build
# ---------------------------------------------------------------------------------------------------

# AppImages are built in extract-and-run mode because a container usually has no FUSE.
build-linux:
  stage: build
  extends: [.rust-linux, .installer-rules]
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    APPIMAGE_EXTRACT_AND_RUN: "1"
  before_script:
    - bash scripts/ci-linux-deps.sh --bundle --node
  script:
    - npm ci
    # Two lines: `export VAR="$(...)"` would hide the helper's failure.
    - RUSTFLAGS="$(node scripts/release-rustflags.mjs)"
    - export RUSTFLAGS
    - npx tauri build --bundles deb,rpm,appimage -- --locked
    - node scripts/release-rustflags.mjs --check src-tauri/target/release/solanum
    # The AppImage carries this machine's libraries: their licences go inside it, and the image is bundled again with
    # them (N-038, see the script). Its extracted images go to the job's own folder, not the machine's shared /tmp.
    - export TMPDIR="$CI_PROJECT_DIR/.tmp"
    - mkdir -p "$TMPDIR"
    - node scripts/appimage-licenses.mjs --write src-tauri/target/release/bundle/appimage src-tauri/target/appimage-licenses
    - npx tauri bundle --bundles appimage --config src-tauri/target/appimage-licenses/tauri.appimage.json
    - node scripts/appimage-licenses.mjs --check src-tauri/target/release/bundle/appimage
  artifacts:
    name: "solanum-linux-$CI_COMMIT_REF_SLUG"
    expire_in: 30 days
    paths:
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/release/bundle/rpm/*.rpm
      - src-tauri/target/release/bundle/appimage/*.AppImage

build-windows:
  stage: build
  extends: [.windows-runner, .installer-rules]
  # NSIS only here, no MSI — this is CI-artifact-only, not the real release
  # (that's release.yml, on GitHub's hosted Windows runners, which still
  # builds both). MSI's WiX linker runs an ICE validation step that needs
  # the VBScript engine via COM, which needs an interactive window station;
  # our gitlab-runner service account doesn't get one ("interact with
  # desktop" is Windows-restricted to LocalSystem, which this runner
  # deliberately doesn't use — running the CI service as LocalSystem caused
  # a different, worse bug: NSIS's build also broke, because LocalSystem's
  # profile lives under C:\Windows\System32\..., which triggers WOW64 path
  # redirection for the 32-bit NSIS stub. Not worth trading one bundler's
  # bug for the other's.)
  script:
    - npm ci
    - $env:RUSTFLAGS = node scripts/release-rustflags.mjs
    # npx.cmd, not npx: PowerShell would pick npx.ps1, and a PowerShell script loses a bare `--`.
    - npx.cmd tauri build --bundles nsis -- --locked
    - node scripts/release-rustflags.mjs --check src-tauri/target/release/solanum.exe
  artifacts:
    name: "solanum-windows-$CI_COMMIT_REF_SLUG"
    expire_in: 30 days
    paths:
      - src-tauri/target/release/bundle/nsis/*.exe

# Android: checks that the APK builds, for both ABIs, and keeps it unsigned. Gradle's daemon is off.
.android-env: &android-env
  - export ANDROID_HOME="$HOME/Android/Sdk"
  - export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006" ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
  - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64

build-android:
  stage: build
  extends: [.linux-runner, .installer-rules]
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    # Gradle's own daemon (the Kotlin compiler may keep one of its own). Tauri starts gradlew itself, so a --no-daemon on
    # our command line could not reach it.
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Downloads only: two ABIs of build output are too large to keep between pipelines.
  cache:
    key:
      files: [src-tauri/Cargo.lock]
      prefix: "$CI_JOB_NAME"
    paths:
      - .cargo/registry
      - .cargo/git
  before_script:
    - *android-env
    - test -d "$NDK_HOME" || { echo "No Android NDK in $NDK_HOME for this user."; exit 1; }
    # Tauri's Android build writes a file named after the app in the temp folder. /tmp is shared with the
    # machine's other users, and one left by another user's build stops this job with "Permission denied".
    - export TMPDIR="$CI_PROJECT_DIR/.tmp"
    - mkdir -p "$TMPDIR"
  script:
    - npm ci
    # Two lines: `export VAR="$(...)"` would hide the helper's failure.
    - RUSTFLAGS="$(node scripts/release-rustflags.mjs --android)"
    - export RUSTFLAGS
    - npm run android:build:apk
    - node scripts/release-rustflags.mjs --check src-tauri/target/aarch64-linux-android/release/libsolanum_lib.so
    - node scripts/release-rustflags.mjs --check src-tauri/target/armv7-linux-androideabi/release/libsolanum_lib.so
    # N-037: 16 KB-page phones and Google Play need every LOAD segment aligned to 0x4000 (the flag comes from
    # release-rustflags.mjs --android and applies to both ABIs).
    - node scripts/check-elf-alignment.mjs src-tauri/target/aarch64-linux-android/release/libsolanum_lib.so src-tauri/target/armv7-linux-androideabi/release/libsolanum_lib.so
    - mkdir -p apk-unsigned
    - cp src-tauri/gen/android/app/build/outputs/apk/*/release/*-release-unsigned.apk apk-unsigned/
  # Runs before the artifacts are collected, which are outside this folder. The disk is not large.
  after_script:
    - rm -rf src-tauri/target src-tauri/gen/android/app/build
  artifacts:
    name: "solanum-android-unsigned-$CI_COMMIT_REF_SLUG"
    expire_in: 1 day
    paths:
      - apk-unsigned/*.apk
