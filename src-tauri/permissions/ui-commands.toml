# The application commands the webview may call (Tauri's app ACL).
#
# Because this folder holds a permission, Tauri refuses every application
# command that no capability grants; capabilities/default.json grants this
# one. A command that is registered in generate_handler! but missing here is
# therefore unreachable from the UI, and one listed here must be registered.
# `npm run check:ipc` keeps this list, the registration list and the
# frontend's invoke() calls in step; the `ui_commands_permission_*` unit test
# checks it against the ACL Tauri actually builds.

[[permission]]
identifier = "ui-commands"
description = "Every application command the Solanum UI calls."
commands.allow = [
  "ack_terminal_output",
  "add_command",
  "add_credential",
  "add_folder",
  "add_mirror_to_server",
  "add_note",
  "add_snippet",
